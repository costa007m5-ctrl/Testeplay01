##
## Configuração Nginx para aaPanel — NetPlay
## Frontend: porta 80 | API: porta 83
##
## Copie este arquivo para o site no aaPanel:
## /www/server/panel/vhost/nginx/netplay.conf
##

server {
    listen 80;
    server_name seu-dominio.com;  # Troque pelo seu domínio ou IP

    # Servir os arquivos estáticos do frontend React
    root /www/wwwroot/netplay/artifacts/netplay/dist/public;
    index index.html;

    # Compressão gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;

    # Cache para assets estáticos
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Proxy da API para o servidor Node.js na porta 83
    location /api/ {
        proxy_pass http://127.0.0.1:83;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # Suporte a React Router (SPA) — todas as rotas vão para index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Segurança
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";
}
